{% extends "base.html" %}
{% block titulo %}{{ 'Editar' if prato else 'Novo' }} prato · Sabor & Clic{% endblock %}
{% block conteudo %}
<div class="cabecalho-pagina">
  <div>
    <h1>{{ 'Editar' if prato else 'Novo' }} prato</h1>
    <p>Os campos com * são obrigatórios.</p>
  </div>
</div>
<form method="post" class="painel formulario grade-form">
  <label>Nome do Prato *<input name="nome" required value="{{ prato.nome if prato else request.form.get('nome', '') }}"></label>
  <label>Categoria *<input name="categoria" required placeholder="Ex: Entradas, Pratos Principais, Bebidas" value="{{ prato.categoria if prato else request.form.get('categoria', '') }}"></label>
  <label>Descrição<textarea name="descricao" rows="2">{{ prato.descricao if prato else request.form.get('descricao', '') }}</textarea></label>
  <label>Preço (R$) *<input name="preco" inputmode="decimal" required placeholder="12,90" value="{{ ('%.2f'|format(prato.preco_centavos)) if prato else request.form.get('preco', '') }}"></label>
  <label>Estoque *<input type="number" name="estoque" min="0" required value="{{ prato.estoque if prato else request.form.get('estoque', 0) }}"></label>
  <label class="checkbox-label">
    <input type="checkbox" name="ativo" value="1" {{ 'checked' if not prato or prato.ativo }}> Exibir no Cardápio
  </label>
  <div class="form-acoes">
    <a class="botao secundario" href="{{ url_for('prato.listar') }}">Cancelar</a>
    <button class="botao primario">Salvar prato</button>
  </div>
</form>
{% endblock %}
