{% extends 'base.html' %}{% block titulo %}Cozinha · Sabor & Clic{% endblock %}{% block conteudo %}<section class="faixa-pagina"><h1>Fila da cozinha</h1></section><div class="historico-tabela"><table><thead><tr><th>Pedido</th><th>Cliente</th><th>Status</th><th>Ação</th></tr></thead><tbody>{% for p in pedidos %}<tr><td>#SC-{{ '%04d'|format(p.id) }}</td><td>{{ p.usuario_nome }}</td><td>{{ p.status }}</td><td><form method="post" action="{{ url_for('pedido.atualizar_status',pedido_id=p.id) }}"><select name="status">{% for st in ['Aguardando','Em Preparo','Pronto','Entregue','Não entregue'] %}<option value="{{ st }}" {{ 'selected' if p.status == st else '' }}>{{ st }}</option>{% endfor %}</select><button class="botao primario">Atualizar</button></form></td></tr>{% else %}<tr><td colspan="4">Nenhum pedido pendente.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
