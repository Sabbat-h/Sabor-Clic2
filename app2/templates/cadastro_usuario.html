{% extends "base.html" %}{% block titulo %}Cadastro · Sabor & Clic{% endblock %}{% block classe_pagina %}pagina-cadastro{% endblock %}{% block conteudo %}<section class="cadastro-layout"><div class="ornamento-cadastro">──── ♧ ────</div><h1>Cadastro</h1><p>Junte-se à comunidade <strong>Sabor &amp; Clic</strong></p><form method="post" class="cadastro-box"><label>♙ &nbsp; Nome completo<input name="nome" placeholder="Ex.: Ana Souza" required autocomplete="name"></label><label>✉ &nbsp; E-mail<input name="email" type="email" placeholder="seu@email.com" required autocomplete="email"></label><label>♙ &nbsp; Nome de usuário<input name="usuario" placeholder="Escolha seu usuário" required minlength="3" autocomplete="username"></label><label>♙ &nbsp; Senha<input name="senha" type="password" placeholder="Mínimo de 6 caracteres" required minlength="6" autocomplete="new-password"></label><label>♙ &nbsp; Confirmar senha<input name="confirmar_senha" type="password" placeholder="Digite sua senha novamente" required minlength="6" autocomplete="new-password"></label><button class="botao rosa">Criar Conta →</button><p>Já tem conta? <a href="{{ url_for('auth.login') }}">Fazer login</a></p></form></section>{% endblock %}
