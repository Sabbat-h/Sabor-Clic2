{% extends "base.html" %}
{% block titulo %}Criar conta · Sabor & Clic{% endblock %}
{% block conteudo %}
<section class="auth-card">
  <h1>Criar conta</h1>
  <form method="post" class="formulario">
    <label>Nome completo<input name="nome" required minlength="2"></label>
    <label>Usuário<input name="usuario" required minlength="3" autocomplete="username"></label>
    <label>Perfil de Acesso
      <select name="tipo_acesso" required>
        <option value="CLIENTE" selected>Cliente (Consumidor)</option>
        <option value="COZINHEIRO">Cozinheiro (Operador KDS)</option>
        <option value="ADMIN">Administrador (Gestor)</option>
      </select>
    </label>
    <label>Senha<input type="password" name="senha" required minlength="6" autocomplete="new-password"></label>
    <button class="botao primario">Cadastrar</button>
  </form>
  <p><a href="{{ url_for('auth.login') }}">Voltar ao login</a></p>
</section>
{% endblock %}
